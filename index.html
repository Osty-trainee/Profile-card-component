<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/main.css">

  <title>Frontend Mentor | Profile card component</title>
</head>
<body>
  <main class="profile-card">
    <header class="profile-card__header"></header>

    <section class="profile-card__body">
      <div class="profile-card__avatar-container">
        <img src="./images/image-victor.jpg" alt="Avatar Victor Crest" class="profile-card__avatar">
      </div>

      <h1 class="profile-card__name">
        Victor Crest <span class="profile-card__age">26</span>
      </h1>
      <p class="profile-card__location">London</p>
    </section>

    <hr class="profile-card__divider">

    <footer class="profile-card__stats">
      <div class="profile-card__stat-item">
        <span class="profile-card__stat-number">80K</span>
        <span class="profile-card__stat-label">Followers</span>
      </div>
      <div class="profile-card__stat-item">
        <span class="profile-card__stat-number">803K</span>
        <span class="profile-card__stat-label">Likes</span>
      </div>
      <div class="profile-card__stat-item">
        <span class="profile-card__stat-number">1.4K</span>
        <span class="profile-card__stat-label">Photos</span>
      </div>
    </footer>
  </main>
</body>
</html>
